###############################################################################
# SOC-TA-auditbeat tags.conf
# Tags are the exact constraint tags of the CIM 6.x data models
# (Splunk_SA_CIM default/data/models/*.json). Eventtypes without a stanza
# here are intentionally untagged (state snapshots, sessions, duplicates).
###############################################################################

#--- Endpoint.Processes: process report
[eventtype=auditbeat_process_start]
process = enabled
report = enabled

[eventtype=auditbeat_auditd_process_start]
process = enabled
report = enabled

[eventtype=auditbeat_auditd_user_cmd]
process = enabled
report = enabled

#--- Endpoint.Ports: listening port
[eventtype=auditbeat_auditd_socket_bind]
listening = enabled
port = enabled

#--- Endpoint.Services: service report
[eventtype=auditbeat_auditd_service_start]
service = enabled
report = enabled

[eventtype=auditbeat_auditd_service_stop]
service = enabled
report = enabled

#--- Endpoint.Filesystem: endpoint filesystem
# Not tagged "change": Change.All_Changes excludes object_category=file.
[eventtype=auditbeat_fim_change]
endpoint = enabled
filesystem = enabled

[eventtype=auditbeat_auditd_file_access]
endpoint = enabled
filesystem = enabled

#--- Authentication (+ privileged)
[eventtype=auditbeat_auditd_user_login]
authentication = enabled

[eventtype=auditbeat_auditd_user_auth]
authentication = enabled

[eventtype=auditbeat_auditd_privileged_auth]
authentication = enabled
privileged = enabled

# Enable these two (in local/tags.conf) when the auditd module does not run;
# otherwise each logon would be counted twice.
[eventtype=auditbeat_login_success]
authentication = disabled

[eventtype=auditbeat_login_failure]
authentication = disabled

#--- Change.Account_Management: change account
[eventtype=auditbeat_auditd_user_change]
change = enabled
account = enabled

[eventtype=auditbeat_auditd_group_change]
change = enabled
account = enabled

[eventtype=auditbeat_user_change]
change = enabled
account = enabled

#--- Change.Endpoint_Changes: change endpoint
[eventtype=auditbeat_package_change]
change = enabled
endpoint = enabled

[eventtype=auditbeat_host_change]
change = enabled
endpoint = enabled

#--- Change.Auditing_Changes: change audit
[eventtype=auditbeat_auditd_audit_change]
change = enabled
audit = enabled

#--- Network_Traffic: network communicate
[eventtype=auditbeat_socket_flow]
network = enabled
communicate = enabled

[eventtype=auditbeat_auditd_socket_connection]
network = enabled
communicate = enabled

#--- Compute_Inventory
# OS (system version) and Network (network) datasets
[eventtype=auditbeat_host_inventory]
inventory = enabled
system = enabled
version = enabled
network = enabled

# User dataset
[eventtype=auditbeat_user_inventory]
inventory = enabled
user = enabled

# User.Default_Accounts (root)
[eventtype=auditbeat_user_inventory_default]
inventory = enabled
user = enabled
default = enabled
