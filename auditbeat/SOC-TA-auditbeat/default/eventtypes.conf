###############################################################################
# SOC-TA-auditbeat eventtypes.conf
#
# One eventtype per Auditbeat event class. Every search starts with the
# sourcetype and uses raw JSON fields only, so field values double as indexed
# terms. Index constraints are deliberately left out: the CIM
# cim_<Model>_indexes macros scope the data models, and the auditbeat_index
# macro is available for ad-hoc searches.
###############################################################################

#--- Endpoint.Processes --------------------------------------------------------
[auditbeat_process_start]
search = sourcetype=auditbeat event.module=system event.dataset=process event.action IN (process_started, process_ran, process_changed_image)

[auditbeat_process_stop]
search = sourcetype=auditbeat event.module=system event.dataset=process event.action=process_stopped

[auditbeat_process_state]
search = sourcetype=auditbeat event.module=system event.dataset=process event.action=existing_process

[auditbeat_auditd_process_start]
search = sourcetype=auditbeat event.module=auditd auditd.message_type=syscall event.action=executed

# sudo command log (USER_CMD). Overlaps with execve records when execve audit
# rules are loaded as well.
[auditbeat_auditd_user_cmd]
search = sourcetype=auditbeat event.module=auditd auditd.message_type=user_cmd

#--- Endpoint.Ports ------------------------------------------------------------
[auditbeat_auditd_socket_bind]
search = sourcetype=auditbeat event.module=auditd event.action="bound-socket" auditd.data.socket.family IN (ipv4, ipv6) auditd.data.socket.port=* NOT auditd.data.socket.port=0

#--- Endpoint.Services ---------------------------------------------------------
[auditbeat_auditd_service_start]
search = sourcetype=auditbeat event.module=auditd auditd.message_type=service_start

[auditbeat_auditd_service_stop]
search = sourcetype=auditbeat event.module=auditd auditd.message_type=service_stop

#--- Endpoint.Filesystem -------------------------------------------------------
[auditbeat_fim_change]
search = sourcetype=auditbeat event.module=file_integrity NOT event.action{}=initial_scan

[auditbeat_fim_initial_scan]
search = sourcetype=auditbeat event.module=file_integrity event.action{}=initial_scan

# Syscalls on watched paths (auditctl -w ... / -F path=...).
[auditbeat_auditd_file_access]
search = sourcetype=auditbeat event.module=auditd auditd.message_type=syscall event.category{}=file NOT event.action IN ("checked-metadata-of", "checked-filesystem-metadata-of", "mounted", "unmounted")

#--- Authentication ------------------------------------------------------------
# One record per logon: sshd and login emit USER_LOGIN (success, and one
# failure per bad password or invalid user). USER_AUTH from those two apps
# would double-count, so it is kept in an untagged eventtype. OpenSSH 9.8+
# runs PAM in sshd-session (and sshd-auth in 10.x).
[auditbeat_auditd_user_login]
search = sourcetype=auditbeat event.module=auditd auditd.message_type=user_login

[auditbeat_auditd_user_auth]
search = sourcetype=auditbeat event.module=auditd auditd.message_type=user_auth NOT process.executable IN ("*/sshd", "*/sshd-session", "*/sshd-auth", "*/login")

[auditbeat_auditd_user_auth_login_apps]
search = sourcetype=auditbeat event.module=auditd auditd.message_type=user_auth process.executable IN ("*/sshd", "*/sshd-session", "*/sshd-auth", "*/login")

[auditbeat_auditd_privileged_auth]
search = sourcetype=auditbeat event.module=auditd auditd.message_type=user_auth process.executable IN ("*/sudo", "*/sudoedit", "*/su", "*/runuser", "*/pkexec", "*/doas")

[auditbeat_auditd_session]
search = sourcetype=auditbeat event.module=auditd auditd.message_type IN (user_acct, cred_acq, cred_disp, cred_refr, user_start, user_end, login, user_logout)

# wtmp/btmp logons. Tagged "authentication" but disabled by default in
# tags.conf because the auditd USER_LOGIN records cover the same logons.
[auditbeat_login_success]
search = sourcetype=auditbeat event.module=system event.dataset=login event.action=user_login event.outcome=success

[auditbeat_login_failure]
search = sourcetype=auditbeat event.module=system event.dataset=login event.action=user_login event.outcome=failure

[auditbeat_login_logout]
search = sourcetype=auditbeat event.module=system event.dataset=login event.action=user_logout

[auditbeat_system_boot]
search = sourcetype=auditbeat ((event.module=system event.dataset=login event.action IN (boot, shutdown)) OR (event.module=auditd auditd.message_type IN (system_boot, system_shutdown)))

#--- Change.Account_Management -------------------------------------------------
[auditbeat_auditd_user_change]
search = sourcetype=auditbeat event.module=auditd auditd.message_type IN (add_user, del_user, user_mgmt, user_chauthtok, acct_lock, acct_unlock, role_assign, role_remove, anom_login_failures)

[auditbeat_auditd_group_change]
search = sourcetype=auditbeat event.module=auditd auditd.message_type IN (add_group, del_group, grp_mgmt, grp_chauthtok)

[auditbeat_user_change]
search = sourcetype=auditbeat event.module=system event.dataset=user event.action IN (user_added, user_removed, user_changed, password_changed)

#--- Change.Endpoint_Changes / Auditing_Changes --------------------------------
[auditbeat_package_change]
search = sourcetype=auditbeat event.module=system event.dataset=package event.action IN (package_installed, package_removed, package_updated)

[auditbeat_package_inventory]
search = sourcetype=auditbeat event.module=system event.dataset=package event.action=existing_package

[auditbeat_host_change]
search = sourcetype=auditbeat event.module=system event.dataset=host event.action IN (reboot, hostname_changed, host_id_changed, host_changed)

[auditbeat_auditd_audit_change]
search = sourcetype=auditbeat event.module=auditd auditd.message_type IN (config_change, daemon_start, daemon_end)

#--- Network_Traffic -----------------------------------------------------------
[auditbeat_socket_flow]
search = sourcetype=auditbeat event.module=system event.dataset=socket event.action=network_flow

[auditbeat_auditd_socket_connection]
search = sourcetype=auditbeat event.module=auditd event.action IN ("connected-to", "accepted-connection-from") auditd.data.socket.family IN (ipv4, ipv6)

#--- Inventory -----------------------------------------------------------------
[auditbeat_host_inventory]
search = sourcetype=auditbeat event.module=system event.dataset=host event.action=host

[auditbeat_user_inventory]
search = sourcetype=auditbeat event.module=system event.dataset=user event.action=existing_user

[auditbeat_user_inventory_default]
search = sourcetype=auditbeat event.module=system event.dataset=user event.action=existing_user user.id=0
