###############################################################################
# SOC-TA-auditbeat props.conf
#
# One sourcetype for every Auditbeat module. The raw event is the Auditbeat
# ECS JSON document. All CIM normalisation happens at search time; see
# README.md for the CIM coverage and the known gaps.
#
# Search-time order inside this stanza:
#   KV_MODE=json -> FIELDALIAS -> EVAL -> LOOKUP -> eventtypes -> tags
# EVALs are computed in parallel: no EVAL reads another EVAL's output, which
# is why some expressions (the host chain, the auditd record-type lists) are
# repeated. EVALs may read FIELDALIAS outputs; LOOKUPs may read EVAL outputs.
#
# Field references: KV_MODE=json names nested keys with dots and arrays with
# "{}", e.g. process.args{}. They are quoted with double quotes in FIELDALIAS
# and single quotes inside EVAL expressions.
###############################################################################

[auditbeat]
description = Elastic Auditbeat ECS JSON (auditd, file_integrity, system modules)
category = Operating System
pulldown_type = 1

#------------------------------------------------------------------------------
# Parsing (indexers / heavy forwarders; EVENT_BREAKER_* on universal forwarders)
#
# These settings apply when the JSON documents arrive as a byte stream: file
# monitor of Auditbeat's output.file, HEC /services/collector/raw, TCP, or
# Splunk Connect for Kafka in raw mode. They are ignored for HEC
# /services/collector/event, where every HEC event is already one event and
# _time comes from the HEC "time" field (or index time). Add
# ?auto_extract_timestamp=true to the /event URL to make Splunk read
# @timestamp with TIME_PREFIX/TIME_FORMAT instead.
#------------------------------------------------------------------------------
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
EVENT_BREAKER_ENABLE = true
EVENT_BREAKER = ([\r\n]+)
# auditd events with long EXECVE argument lists and PATH records can exceed
# the 10000-byte default.
TRUNCATE = 100000
# Beats serialise @timestamp as UTC with millisecond precision:
# "@timestamp":"2026-10-24T08:00:07.137Z"
TIME_PREFIX = "@timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC
CHARSET = UTF-8

#------------------------------------------------------------------------------
# Search time
# KV_MODE=json only. Do not also set INDEXED_EXTRACTIONS=json: that extracts
# every field at index time and KV_MODE extracts it again at search time,
# producing duplicate multivalue fields.
#------------------------------------------------------------------------------
KV_MODE = json
AUTO_KV_JSON = true

#------------------------------------------------------------------------------
# Field aliases
# Only CIM fields that have exactly one possible Auditbeat source are aliased;
# every CIM field with several possible sources is an EVAL below.
#
# Nothing in this add-on overwrites an existing field. The original Auditbeat
# fields (event.action, file.path, host, ...) are never touched; CIM fields are
# added beside them. If a CIM field already exists on an event (for example
# from another app), it is kept:
#   FIELDALIAS uses ASNEW, every EVAL is coalesce('<itself>', <mapping>),
#   and every LOOKUP uses OUTPUTNEW with one output field per lookup.
#------------------------------------------------------------------------------
FIELDALIAS-auditbeat_process = "process.pid" ASNEW process_id "process.entity_id" ASNEW process_guid "process.executable" ASNEW process_path "process.working_directory" ASNEW process_current_directory "process.parent.pid" ASNEW parent_process_id "process.parent.name" ASNEW parent_process_name "process.parent.name" ASNEW parent_process_exec "process.parent.executable" ASNEW parent_process_path
FIELDALIAS-auditbeat_network = "source.port" ASNEW src_port "network.bytes" ASNEW bytes "source.bytes" ASNEW bytes_out "destination.bytes" ASNEW bytes_in "network.packets" ASNEW packets "source.packets" ASNEW packets_out "destination.packets" ASNEW packets_in "network.community_id" ASNEW flow_id
FIELDALIAS-auditbeat_file = "file.path" ASNEW file_path
FIELDALIAS-auditbeat_service = "auditd.data.unit" ASNEW service "auditd.data.unit" ASNEW service_name "auditd.data.unit" ASNEW service_id
FIELDALIAS-auditbeat_session = "auditd.session" ASNEW session_id

#------------------------------------------------------------------------------
# Lookup keys (inputs of LOOKUP-auditbeat_actions)
#------------------------------------------------------------------------------
# auditd sets no event.dataset (module and metricset share a name).
EVAL-auditbeat_dataset = coalesce('event.dataset', 'event.module')

# Scalar action key.
#  - file_integrity: event.action is an array (e.g. created + updated); it is
#    collapsed to the action that best describes the final state.
#  - auditd opened-file (open/openat/creat/truncate): split by open flags
#    (x86_64/aarch64 values: O_WRONLY 1, O_RDWR 2, O_CREAT 0x40, O_EXCL 0x80,
#    O_TRUNC 0x200, O_APPEND 0x400). Flags are a1 for open, a2 for openat.
EVAL-auditbeat_action = case(\
  'event.module'=="file_integrity", case(\
    isnotnull(mvfind('event.action{}', "^deleted$")) AND isnull('file.inode'), "deleted",\
    isnotnull(mvfind('event.action{}', "^created$")), "created",\
    isnotnull(mvfind('event.action{}', "^moved$")) AND isnull(mvfind('event.action{}', "^updated$")), "moved",\
    isnotnull(mvfind('event.action{}', "^(updated|moved|config_change|deleted)$")), "updated",\
    isnotnull(mvfind('event.action{}', "^attributes_modified$")), "attributes_modified",\
    true(), mvindex('event.action{}', 0)),\
  'event.module'=="auditd" AND 'event.action'=="opened-file", "opened-file:" . case(\
    'auditd.data.syscall'=="creat", "created",\
    in('auditd.data.syscall', "truncate", "ftruncate", "fallocate"), "modified",\
    in('auditd.data.syscall', "open", "openat") AND floor(tonumber(if('auditd.data.syscall'=="open", 'auditd.data.a1', 'auditd.data.a2'), 16) / 64) % 4 == 3, "created",\
    in('auditd.data.syscall', "open", "openat") AND (tonumber(if('auditd.data.syscall'=="open", 'auditd.data.a1', 'auditd.data.a2'), 16) % 4 > 0 OR floor(tonumber(if('auditd.data.syscall'=="open", 'auditd.data.a1', 'auditd.data.a2'), 16) / 64) % 2 == 1 OR floor(tonumber(if('auditd.data.syscall'=="open", 'auditd.data.a1', 'auditd.data.a2'), 16) / 512) % 4 > 0), "modified",\
    true(), "read"),\
  true(), 'event.action')

# A non-blocking connect() returns EINPROGRESS (auditd result=fail) although
# the connection proceeds.
EVAL-auditbeat_outcome = case(\
  'event.module'=="auditd" AND 'event.action'=="connected-to" AND in('auditd.data.exit', "EINPROGRESS", "EALREADY"), "success",\
  isnotnull('event.outcome'), 'event.outcome',\
  true(), "unknown")

#------------------------------------------------------------------------------
# Common fields
#------------------------------------------------------------------------------
EVAL-vendor = coalesce('vendor', "Elastic")
EVAL-product = coalesce('product', "Auditbeat")
EVAL-vendor_product = coalesce('vendor_product', "Elastic Auditbeat")
EVAL-dvc = coalesce('dvc', coalesce('host.name', 'host.hostname', 'agent.name', mvindex('host.ip{}', 0), host))
EVAL-dvc_ip = coalesce('dvc_ip', mvindex('host.ip{}', 0))
EVAL-os = coalesce('os', if(isnotnull('host.os.name'), trim('host.os.name' . " " . coalesce('host.os.version', "")), null()))

# auditd SYSCALL records: the syscall name. Other auditd records: the numeric
# record type (USER_LOGIN = 1112), filled by LOOKUP-auditd_signature_id.
EVAL-signature_id = coalesce('signature_id', case(\
  'event.module'=="auditd" AND 'auditd.message_type'=="syscall", 'auditd.data.syscall',\
  'event.module'!="auditd", coalesce('event.action', mvjoin('event.action{}', ","))))

#------------------------------------------------------------------------------
# dest / src
# Host-centric by default (the Auditbeat host). Network_Traffic uses the
# traffic endpoints instead.
#------------------------------------------------------------------------------
EVAL-dest = coalesce('dest', case(\
  'event.dataset'=="socket", 'destination.ip',\
  'event.module'=="auditd" AND 'event.action'=="connected-to" AND isnotnull('destination.ip'), 'destination.ip',\
  true(), coalesce('host.name', 'host.hostname', 'agent.name', mvindex('host.ip{}', 0), host)))

EVAL-dest_ip = coalesce('dest_ip', case(\
  'event.dataset'=="socket", 'destination.ip',\
  'event.module'=="auditd" AND 'event.action'=="connected-to", 'destination.ip',\
  'event.module'=="auditd" AND 'event.action'=="bound-socket", 'auditd.data.socket.addr'))

EVAL-dest_port = coalesce('dest_port', tonumber(case(\
  'event.dataset'=="socket", 'destination.port',\
  'event.module'=="auditd" AND 'event.action'=="connected-to", 'destination.port',\
  'event.module'=="auditd" AND 'event.action'=="bound-socket", 'auditd.data.socket.port')))

# USER_AUTH (PAM) never sets source.ip; the peer is in auditd.data.addr
# ("?" when local). Local logons fall back to the host itself.
EVAL-src = coalesce('src', case(\
  'event.dataset'=="socket", 'source.ip',\
  'event.module'=="auditd" AND 'event.action'=="connected-to", coalesce('host.name', 'host.hostname', 'agent.name', mvindex('host.ip{}', 0), host),\
  'event.module'=="auditd" AND 'event.action'=="bound-socket", null(),\
  true(), coalesce('source.ip', 'source.domain', if(match('auditd.data.addr', "^[0-9A-Fa-f:.]+$"), 'auditd.data.addr', null()), if('auditd.data.hostname'!="?", 'auditd.data.hostname', null()), 'host.name', 'host.hostname', 'agent.name')))

EVAL-src_ip = coalesce('src_ip', coalesce('source.ip', if(match('auditd.data.addr', "^[0-9A-Fa-f:.]+$"), 'auditd.data.addr', null())))

#------------------------------------------------------------------------------
# Users
# auditd: user.name = real uid, user.audit.name = login uid (auid),
#         user.effective.name = PAM acct (authenticated / target account),
#         user.target.name = account created/changed/deleted.
#------------------------------------------------------------------------------
EVAL-user = coalesce('user', case(\
  'event.module'=="file_integrity", 'process.user.name',\
  'event.module'=="auditd" AND in('auditd.message_type', "add_user", "del_user", "user_mgmt", "user_chauthtok", "acct_lock", "acct_unlock", "role_assign", "role_remove", "anom_login_failures", "add_group", "del_group", "grp_mgmt", "grp_chauthtok"), coalesce('user.target.name', 'auditd.data.acct', 'group.name'),\
  'event.module'=="auditd" AND in('auditd.message_type', "user_auth", "user_acct", "user_login", "user_logout", "user_start", "user_end", "user_err", "cred_acq", "cred_disp", "cred_refr", "login"), coalesce('user.effective.name', 'user.name', 'auditd.summary.actor.secondary'),\
  'event.module'=="auditd" AND in('auditd.message_type', "config_change", "daemon_start", "daemon_end"), coalesce('user.audit.name', 'user.name'),\
  'event.module'=="auditd", coalesce('user.name', if('auditd.summary.actor.secondary'!="unset", 'auditd.summary.actor.secondary', null())),\
  true(), 'user.name'))

EVAL-user_id = coalesce('user_id', case(\
  'event.module'=="file_integrity", 'process.user.id',\
  'event.module'=="auditd" AND in('auditd.message_type', "add_user", "del_user", "user_mgmt", "user_chauthtok", "acct_lock", "acct_unlock", "role_assign", "role_remove", "anom_login_failures"), coalesce('user.target.id', 'auditd.data.id'),\
  'event.module'=="auditd" AND in('auditd.message_type', "user_auth", "user_acct", "user_login", "user_logout", "user_start", "user_end", "user_err", "cred_acq", "cred_disp", "cred_refr", "login"), coalesce('user.effective.id', 'user.id'),\
  true(), 'user.id'))

EVAL-user_name = coalesce('user_name', case(\
  'event.module'=="auditd" AND in('auditd.message_type', "add_user", "del_user", "user_mgmt", "user_chauthtok", "acct_lock", "acct_unlock", "role_assign", "role_remove", "anom_login_failures", "add_group", "del_group", "grp_mgmt", "grp_chauthtok"), coalesce('user.target.name', 'auditd.data.acct', 'group.name'),\
  'event.dataset'=="user", 'user.name'))

# src_user: who performed an account change, or who initiated a privilege
# escalation (sudo, su, ...). Not set for plain logons.
EVAL-src_user = coalesce('src_user', case(\
  'event.module'=="auditd" AND in('auditd.message_type', "add_user", "del_user", "user_mgmt", "user_chauthtok", "acct_lock", "acct_unlock", "role_assign", "role_remove", "anom_login_failures", "add_group", "del_group", "grp_mgmt", "grp_chauthtok"), coalesce('user.audit.name', 'user.name'),\
  'event.module'=="auditd" AND in('auditd.message_type', "user_auth", "user_acct", "user_login", "user_start", "user_end", "cred_acq", "cred_refr") AND (match('process.executable', "/(sudo|sudoedit|su|runuser|pkexec|doas)$") OR coalesce('user.audit.name', 'user.name') != coalesce('user.effective.name', 'user.name')), coalesce('user.audit.name', 'user.name')))

EVAL-src_user_name = coalesce('src_user_name', if('event.module'=="auditd" AND in('auditd.message_type', "add_user", "del_user", "user_mgmt", "user_chauthtok", "acct_lock", "acct_unlock", "role_assign", "role_remove", "anom_login_failures", "add_group", "del_group", "grp_mgmt", "grp_chauthtok"), coalesce('user.audit.name', 'user.name'), null()))

#------------------------------------------------------------------------------
# Authentication
#------------------------------------------------------------------------------
EVAL-app = coalesce('app', case(\
  'event.dataset'=="login", if(match('user.terminal', "^ssh") OR isnotnull('source.ip'), "sshd", "login"),\
  'event.module'=="auditd" OR 'event.dataset'=="socket" OR 'event.dataset'=="process", coalesce(replace('process.executable', "^.*/", ""), 'process.name')))
EVAL-authentication_method = coalesce('authentication_method', if(match('auditd.data.op', "^PAM:"), "PAM", null()))

#------------------------------------------------------------------------------
# Processes
# "process" means the full command line in Endpoint.Processes but the logon
# executable in Authentication, so it branches on the event class.
#------------------------------------------------------------------------------
EVAL-process = coalesce('process', case(\
  'event.module'=="auditd" AND in('auditd.message_type', "user_auth", "user_acct", "user_login", "user_logout", "user_start", "user_end", "user_err", "cred_acq", "cred_disp", "cred_refr", "login"), coalesce('process.executable', 'auditd.summary.how'),\
  'event.dataset'=="login", null(),\
  true(), coalesce('process.command_line', mvjoin('process.args{}', " "), 'process.title', 'auditd.data.cmd', 'process.executable')))

# Basename of the executable is preferred: process.name is the kernel comm,
# truncated to 15 characters.
EVAL-process_name = coalesce('process_name', coalesce(replace('process.executable', "^.*/", ""), 'process.name', if('auditd.message_type'=="user_cmd", replace('auditd.data.cmd', "^\s*(?:\S*/)?(\S+).*$", "\1"), null())))
EVAL-process_exec = coalesce('process_exec', coalesce(replace('process.executable', "^.*/", ""), 'process.name', if('auditd.message_type'=="user_cmd", replace('auditd.data.cmd', "^\s*(?:\S*/)?(\S+).*$", "\1"), null())))
EVAL-process_hash = coalesce('process_hash', coalesce('process.hash.sha256', 'process.hash.sha1', 'process.hash.md5'))
# process.parent.* exists only with the optional add_process_metadata recipe
# in README.md.
EVAL-parent_process = coalesce('parent_process', coalesce('process.parent.command_line', mvjoin('process.parent.args{}', " "), 'process.parent.executable'))

# Linux has no integrity levels. Heuristic: root without a login session
# (auditd auid unset, or a non-interactive process) = system, other root =
# high, any other user = medium.
EVAL-process_integrity_level = coalesce('process_integrity_level', case(\
  ('event.dataset'=="process" OR 'event.action'=="executed" OR 'event.action'=="ran-command") AND coalesce('user.effective.id', 'user.id')=="0" AND (('event.module'=="auditd" AND isnull('user.audit.id')) OR 'process.interactive'=="false"), "system",\
  ('event.dataset'=="process" OR 'event.action'=="executed" OR 'event.action'=="ran-command") AND coalesce('user.effective.id', 'user.id')=="0", "high",\
  ('event.dataset'=="process" OR 'event.action'=="executed" OR 'event.action'=="ran-command") AND isnotnull(coalesce('user.effective.id', 'user.id')), "medium"))

#------------------------------------------------------------------------------
# Filesystem
#------------------------------------------------------------------------------
EVAL-file_name = coalesce('file_name', if(isnotnull('file.path'), coalesce('file.name', replace('file.path', "^.*/", "")), null()))
EVAL-file_hash = coalesce('file_hash', coalesce('file.hash.sha256', 'file.hash.sha1', 'file.hash.md5', 'hash.sha256', 'hash.sha1', 'hash.md5'))
# CIM defines file_size in kilobytes; Auditbeat reports bytes.
EVAL-file_size = coalesce('file_size', if(isnotnull('file.size'), round(tonumber('file.size') / 1024, 2), null()))
EVAL-file_acl = coalesce('file_acl', if(isnotnull('file.mode'), "mode=" . 'file.mode' . coalesce(" owner=" . 'file.owner', "") . coalesce(" group=" . 'file.group', "") . coalesce(" acl=" . mvjoin('file.posix_acl_access{}', ","), ""), null()))
# Auditbeat file times are RFC 3339 UTC with nanoseconds.
EVAL-file_modify_time = coalesce('file_modify_time', strptime(replace('file.mtime', "^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)(?:\.\d+)?Z$", "\1+0000"), "%Y-%m-%dT%H:%M:%S%z"))
EVAL-file_access_time = coalesce('file_access_time', strptime(replace('file.accessed', "^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)(?:\.\d+)?Z$", "\1+0000"), "%Y-%m-%dT%H:%M:%S%z"))
# file.created is not collected on Linux; for a newly created file its mtime
# is the creation time.
EVAL-file_create_time = coalesce('file_create_time', coalesce(\
  strptime(replace('file.created', "^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)(?:\.\d+)?Z$", "\1+0000"), "%Y-%m-%dT%H:%M:%S%z"),\
  if('event.module'=="file_integrity" AND isnotnull(mvfind('event.action{}', "^created$")), strptime(replace('file.mtime', "^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)(?:\.\d+)?Z$", "\1+0000"), "%Y-%m-%dT%H:%M:%S%z"), null())))
EVAL-image = coalesce('image', case(\
  'event.module'=="file_integrity", 'process.name',\
  'event.module'=="auditd" AND isnotnull(mvfind('event.category{}', "^file$")), 'process.executable'))

#------------------------------------------------------------------------------
# Ports (auditd bind). bind is the only Auditbeat record that carries the
# local port; it does not prove listen() and does not reveal tcp vs udp.
#------------------------------------------------------------------------------
EVAL-state = coalesce('state', if('event.module'=="auditd" AND 'event.action'=="bound-socket", "listening", null()))
EVAL-creation_time = coalesce('creation_time', if('event.module'=="auditd" AND 'event.action'=="bound-socket", _time, null()))

#------------------------------------------------------------------------------
# Network_Traffic
#------------------------------------------------------------------------------
# accept() implies a connection-oriented (TCP) socket; connect() and bind()
# do not reveal the transport.
EVAL-transport = coalesce('transport', case(\
  'event.dataset'=="socket" AND 'network.transport'!="unknown", 'network.transport',\
  'event.module'=="auditd" AND 'event.action'=="accepted-connection-from", "tcp"))
EVAL-protocol = coalesce('protocol', case(\
  'event.dataset'=="socket", "ip",\
  'event.module'=="auditd" AND in('event.action', "connected-to", "accepted-connection-from", "bound-socket") AND in('auditd.data.socket.family', "ipv4", "ipv6"), "ip"))
EVAL-protocol_version = coalesce('protocol_version', case(\
  'event.dataset'=="socket", 'network.type',\
  'event.module'=="auditd" AND in('auditd.data.socket.family', "ipv4", "ipv6"), 'auditd.data.socket.family'))
# ECS host-perspective values ingress/egress -> CIM inbound/outbound.
EVAL-direction = coalesce('direction', case(\
  in('network.direction', "ingress", "inbound"), "inbound",\
  in('network.direction', "egress", "outbound"), "outbound"))
# event.duration is in nanoseconds.
EVAL-duration = coalesce('duration', if('event.dataset'=="socket", round(tonumber('event.duration') / 1000000000, 3), null()))

#------------------------------------------------------------------------------
# Change (Account_Management, Endpoint_Changes, Auditing_Changes)
#------------------------------------------------------------------------------
EVAL-object = coalesce('object', case(\
  'event.module'=="auditd" AND in('auditd.message_type', "add_group", "del_group", "grp_mgmt", "grp_chauthtok"), coalesce('group.name', 'auditd.data.grp', 'auditd.data.acct'),\
  'event.module'=="auditd" AND in('auditd.message_type', "add_user", "del_user", "user_mgmt", "user_chauthtok", "acct_lock", "acct_unlock", "role_assign", "role_remove", "anom_login_failures"), coalesce('user.target.name', 'auditd.data.acct'),\
  'event.module'=="auditd" AND 'auditd.message_type'=="config_change", coalesce('auditd.data.key', 'auditd.data.op'),\
  'event.module'=="auditd" AND in('auditd.message_type', "daemon_start", "daemon_end"), "auditd",\
  'event.dataset'=="user", 'user.name',\
  'event.dataset'=="package", 'package.name',\
  'event.dataset'=="host", coalesce('system.audit.host.hostname', 'host.hostname')))

EVAL-object_id = coalesce('object_id', case(\
  'event.module'=="auditd" AND in('auditd.message_type', "add_group", "del_group", "grp_mgmt", "grp_chauthtok"), coalesce('group.id', 'auditd.data.id'),\
  'event.module'=="auditd" AND in('auditd.message_type', "add_user", "del_user", "user_mgmt", "user_chauthtok", "acct_lock", "acct_unlock", "role_assign", "role_remove", "anom_login_failures"), coalesce('user.target.id', 'auditd.data.id'),\
  'event.dataset'=="user", 'user.id',\
  'event.dataset'=="package", 'system.audit.package.entity_id',\
  'event.dataset'=="host", coalesce('system.audit.host.id', 'host.id')))

EVAL-object_attrs = coalesce('object_attrs', case(\
  'event.module'=="auditd" AND in('auditd.message_type', "add_user", "del_user", "user_mgmt", "user_chauthtok", "acct_lock", "acct_unlock", "role_assign", "role_remove", "anom_login_failures", "add_group", "del_group", "grp_mgmt", "grp_chauthtok", "config_change"), mvappend("op=" . 'auditd.data.op', "grp=" . 'auditd.data.grp', "list=" . 'auditd.data.list'),\
  'event.dataset'=="user", mvappend("shell=" . 'system.audit.user.shell', "home=" . 'system.audit.user.dir', "groups=" . mvjoin('system.audit.user.group{}.name', ",")),\
  'event.dataset'=="package", mvappend("version=" . 'package.version', "arch=" . 'system.audit.package.arch', "type=" . 'package.type'),\
  'event.dataset'=="host", mvappend("hostname=" . 'system.audit.host.hostname', "os=" . 'system.audit.host.os.name' . " " . 'system.audit.host.os.version', "kernel=" . 'system.audit.host.os.kernel')))

EVAL-command = coalesce('command', if('event.module'=="auditd" AND in('auditd.message_type', "add_user", "del_user", "user_mgmt", "user_chauthtok", "acct_lock", "acct_unlock", "role_assign", "role_remove", "add_group", "del_group", "grp_mgmt", "grp_chauthtok", "config_change"), coalesce('process.executable', 'auditd.summary.how'), null()))

#------------------------------------------------------------------------------
# Inventory (system/host and system/user state events)
#------------------------------------------------------------------------------
EVAL-version = coalesce('version', if('event.dataset'=="host", coalesce('system.audit.host.os.version', 'host.os.version'), null()))
EVAL-family = coalesce('family', if('event.dataset'=="host", coalesce('system.audit.host.architecture', 'host.architecture'), null()))
EVAL-description = coalesce('description', if('event.dataset'=="host", 'message', null()))
EVAL-ip = coalesce('ip', if('event.dataset'=="host", 'system.audit.host.ip{}', null()))
EVAL-mac = coalesce('mac', if('event.dataset'=="host", mvmap('system.audit.host.mac{}', lower(replace('system.audit.host.mac{}', "-", ":"))), null()))
EVAL-name = coalesce('name', if('event.dataset'=="host", coalesce('system.audit.host.hostname', 'host.hostname'), null()))
EVAL-shell = coalesce('shell', if('event.dataset'=="user", 'system.audit.user.shell', null()))
EVAL-interactive = coalesce('interactive', if('event.dataset'=="user" AND isnotnull('system.audit.user.shell'), if(match('system.audit.user.shell', "/(nologin|false|sync|halt|shutdown)$"), "false", "true"), null()))

#------------------------------------------------------------------------------
# Lookups (run after every EVAL above)
#------------------------------------------------------------------------------
LOOKUP-auditbeat_actions_action = auditbeat_actions_lookup event_module AS "event.module" auditbeat_dataset auditbeat_action auditbeat_outcome OUTPUTNEW action
LOOKUP-auditbeat_actions_change_type = auditbeat_actions_lookup event_module AS "event.module" auditbeat_dataset auditbeat_action auditbeat_outcome OUTPUTNEW change_type
LOOKUP-auditbeat_actions_object_category = auditbeat_actions_lookup event_module AS "event.module" auditbeat_dataset auditbeat_action auditbeat_outcome OUTPUTNEW object_category
LOOKUP-auditbeat_actions_result = auditbeat_actions_lookup event_module AS "event.module" auditbeat_dataset auditbeat_action auditbeat_outcome OUTPUTNEW result
LOOKUP-auditbeat_actions_signature = auditbeat_actions_lookup event_module AS "event.module" auditbeat_dataset auditbeat_action auditbeat_outcome OUTPUTNEW signature
LOOKUP-auditbeat_actions_status = auditbeat_actions_lookup event_module AS "event.module" auditbeat_dataset auditbeat_action auditbeat_outcome OUTPUTNEW status
LOOKUP-auditd_message_types = auditd_message_types_lookup auditd_message_type AS "auditd.message_type" OUTPUTNEW auditd_message_type_id auditd_message_type_description
# Fallbacks for auditd record types that auditbeat_actions.csv does not map.
LOOKUP-auditd_signature = auditd_message_types_lookup auditd_message_type AS "auditd.message_type" OUTPUTNEW auditd_message_type_description AS signature
LOOKUP-auditd_signature_id = auditd_message_types_lookup auditd_message_type AS "auditd.message_type" OUTPUTNEW auditd_message_type_id AS signature_id
