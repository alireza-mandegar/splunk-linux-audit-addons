###############################################################################
# SOC-TA-auditbeat transforms.conf
# Search-time lookups only. This add-on defines no index-time transforms.
###############################################################################

# Event class -> CIM action, status, change_type, object_category, result and
# a readable signature. Keyed on event.module plus the auditbeat_dataset,
# auditbeat_action and auditbeat_outcome helper fields computed in props.conf.
# Rows with auditbeat_outcome="*" match any outcome; specific rows come first
# and max_matches = 1 returns the first match.
[auditbeat_actions_lookup]
filename = auditbeat_actions.csv
match_type = WILDCARD(auditbeat_outcome)
max_matches = 1
case_sensitive_match = true

# auditd record type (auditd.message_type, lowercase) -> numeric record type
# and description. Generated from go-libaudit v2.6.2 and the Linux /
# audit-userspace headers.
[auditd_message_types_lookup]
filename = auditd_message_types.csv
max_matches = 1
case_sensitive_match = true
