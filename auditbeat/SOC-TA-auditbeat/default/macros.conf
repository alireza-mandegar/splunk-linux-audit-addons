###############################################################################
# SOC-TA-auditbeat macros.conf
###############################################################################

# Index(es) holding Auditbeat data. Override in local/macros.conf, e.g.
#   definition = (index=auditbeat OR index=auditbeat_dmz)
# Used by ad-hoc and validation searches; eventtypes do not depend on it.
[auditbeat_index]
definition = index=auditbeat
iseval = 0

# Index plus sourcetype, for ad-hoc searches: `auditbeat` event.module=auditd
[auditbeat]
definition = `auditbeat_index` sourcetype=auditbeat
iseval = 0
