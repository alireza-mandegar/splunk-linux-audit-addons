###############################################################################
# SOC-TA-auditd macros.conf
###############################################################################

# Index(es) holding auditd data. Override in local/macros.conf, e.g.
#   definition = (index=auditd OR index=linux)
# Used by ad-hoc and validation searches; eventtypes do not depend on it.
[auditd_index]
definition = index=auditd
iseval = 0

# Index plus sourcetype, for ad-hoc searches: `auditd` type=USER_LOGIN
[auditd]
definition = `auditd_index` sourcetype=auditd
iseval = 0
