###############################################################################
# SOC-TA-auditd eventtypes.conf
#
# One eventtype per audit event class. Searches use raw record fields only
# (type, SYSCALL, exe, saddr_fam, ...), so their values double as indexed
# terms. Syscall classes need log_format = ENRICHED (SYSCALL=<name>).
# Index constraints are left out on purpose: the CIM cim_<Model>_indexes
# macros scope the data models, and the auditd_index macro is available for
# ad-hoc searches.
###############################################################################

#--- Endpoint.Processes --------------------------------------------------------
[auditd_process_start]
search = sourcetype=auditd auditd_record_type=SYSCALL SYSCALL IN (execve, execveat)

# sudo command log. Overlaps with execve events when execve rules are loaded.
[auditd_user_cmd]
search = sourcetype=auditd type=USER_CMD

#--- Endpoint.Ports ------------------------------------------------------------
[auditd_socket_bind]
search = sourcetype=auditd auditd_record_type=SYSCALL SYSCALL=bind saddr_fam IN (inet, inet6) lport=* NOT lport=0

#--- Endpoint.Services ---------------------------------------------------------
[auditd_service_start]
search = sourcetype=auditd type=SERVICE_START

[auditd_service_stop]
search = sourcetype=auditd type=SERVICE_STOP

#--- Endpoint.Filesystem -------------------------------------------------------
# File syscalls that recorded a PATH item (watches: auditctl -w, or -F path= /
# -F dir= rules).
[auditd_file_access]
search = sourcetype=auditd auditd_record_type=SYSCALL type=PATH SYSCALL IN (open, openat, openat2, open_by_handle_at, creat, truncate, ftruncate, fallocate, unlink, unlinkat, rmdir, rename, renameat, renameat2, mkdir, mkdirat, link, linkat, symlink, symlinkat, mknod, mknodat, chmod, fchmod, fchmodat, fchmodat2, chown, fchown, lchown, fchownat, setxattr, lsetxattr, fsetxattr, removexattr, lremovexattr, fremovexattr, utime, utimes, utimensat, futimesat)

#--- Authentication ------------------------------------------------------------
# One record per logon: sshd and login write USER_LOGIN (success, and one
# failure per bad password or invalid user). USER_AUTH from those programs
# would count the same logon twice, so it is kept in an untagged eventtype.
# OpenSSH 9.8+ runs PAM in sshd-session (and sshd-auth in 10.x).
[auditd_user_login]
search = sourcetype=auditd type=USER_LOGIN

[auditd_user_auth]
search = sourcetype=auditd type=USER_AUTH NOT exe IN ("*/sshd", "*/sshd-session", "*/sshd-auth", "*/login")

[auditd_user_auth_login_apps]
search = sourcetype=auditd type=USER_AUTH exe IN ("*/sshd", "*/sshd-session", "*/sshd-auth", "*/login")

[auditd_privileged_auth]
search = sourcetype=auditd type=USER_AUTH exe IN ("*/sudo", "*/sudoedit", "*/su", "*/runuser", "*/pkexec", "*/doas")

[auditd_session]
search = sourcetype=auditd type IN (USER_ACCT, CRED_ACQ, CRED_DISP, CRED_REFR, USER_START, USER_END, USER_LOGOUT, LOGIN)

#--- Change.Account_Management -------------------------------------------------
[auditd_user_change]
search = sourcetype=auditd type IN (ADD_USER, DEL_USER, USER_MGMT, USER_CHAUTHTOK, ACCT_LOCK, ACCT_UNLOCK, ROLE_ASSIGN, ROLE_REMOVE, ANOM_LOGIN_FAILURES)

[auditd_group_change]
search = sourcetype=auditd type IN (ADD_GROUP, DEL_GROUP, GRP_MGMT, GRP_CHAUTHTOK)

#--- Change.Auditing_Changes ---------------------------------------------------
[auditd_audit_change]
search = sourcetype=auditd type IN (CONFIG_CHANGE, DAEMON_START, DAEMON_END, DAEMON_ABORT)

#--- Change.Endpoint_Changes (+ Endpoint_Restarts) -----------------------------
# rpm / dnf write SOFTWARE_UPDATE (dpkg / apt do not).
[auditd_software_change]
search = sourcetype=auditd type=SOFTWARE_UPDATE

[auditd_system_boot]
search = sourcetype=auditd type=SYSTEM_BOOT

[auditd_system_shutdown]
search = sourcetype=auditd type=SYSTEM_SHUTDOWN

#--- Network_Traffic -----------------------------------------------------------
[auditd_socket_connection]
search = sourcetype=auditd auditd_record_type=SYSCALL SYSCALL IN (connect, accept, accept4) saddr_fam IN (inet, inet6)

#--- Untagged: other security-relevant classes ---------------------------------
[auditd_mac_denial]
search = sourcetype=auditd type IN (AVC, USER_AVC, SELINUX_ERR, USER_SELINUX_ERR)

[auditd_anomaly]
search = sourcetype=auditd type IN (ANOM_ABEND, ANOM_PROMISCUOUS, ANOM_LINK, ANOM_CREAT, ANOM_EXEC, ANOM_MK_EXEC)

[auditd_kernel_module]
search = sourcetype=auditd auditd_record_type=SYSCALL SYSCALL IN (init_module, finit_module, delete_module)
