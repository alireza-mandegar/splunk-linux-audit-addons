###############################################################################
# SOC-TA-auditd transforms.conf
# Search-time field extractions and lookups. No index-time transforms.
###############################################################################

#------------------------------------------------------------------------------
# key=value pairs of every record. Values are "quoted" or bare (hex-encoded
# strings, numbers, symbols). Delimiters: whitespace, the single quotes of the
# user-space msg='...' and the 0x1D separator before the ENRICHED fields.
# msg= itself is skipped so the fields inside msg='...' are extracted.
# CLEAN_KEYS turns old-auid into old_auid.
#------------------------------------------------------------------------------
[auditd_kv]
REGEX = (?:^|[\s'\x1d])(?!msg=)([A-Za-z_][\w-]*)="?((?<=")[^"\r\n]*|(?<!")[^\s'"\x1d]+)
FORMAT = $1::$2
MV_ADD = true
CLEAN_KEYS = true

#------------------------------------------------------------------------------
# auditd_record_type: the record that names the event. Auxiliary records
# (they only describe a syscall) are skipped, so CONFIG_CHANGE + SYSCALL is a
# CONFIG_CHANGE event and SYSCALL + EXECVE + PATH is a SYSCALL event. The
# first transform that matches wins (MV_ADD = false).
#------------------------------------------------------------------------------
[auditd_record_type_primary]
REGEX = \btype=((?!(?:SYSCALL|EXECVE|CWD|PATH|PROCTITLE|SOCKADDR|EOE|BPRM_FCAPS|CAPSET|MMAP|FD_PAIR|OBJ_PID|IPC|IPC_SET_PERM|MQ_OPEN|MQ_SENDRECV|MQ_NOTIFY|MQ_GETSETATTR|SOCKETCALL|KERN_MODULE|FANOTIFY|TIME_INJOFFSET|TIME_ADJNTPVAL|OPENAT2)\s)[A-Z0-9_]+(?:\[\d+\])?) msg=audit\(
FORMAT = auditd_record_type::$1

[auditd_record_type_syscall]
REGEX = \btype=(SYSCALL) msg=audit\(
FORMAT = auditd_record_type::$1

[auditd_record_type_first]
REGEX = \btype=([A-Z0-9_]+(?:\[\d+\])?) msg=audit\(
FORMAT = auditd_record_type::$1

#------------------------------------------------------------------------------
# Per-record values
#------------------------------------------------------------------------------
# <epoch>.<ms>:<serial>, the id shared by all records of the event
[auditd_event_id]
REGEX = msg=audit\(([\d.]+:\d+)\)
FORMAT = auditd_event_id::$1

# First exe / comm / cwd / acct / cmd with its encoding kept ("quoted" or
# HEX); props.conf decodes them into the CIM fields.
[auditd_raw_exe]
REGEX = [\s']exe=("[^"\r\n]*"|[0-9A-F]+(?=[\s'\x1d]|$)|\(null\))
FORMAT = auditd_raw_exe::$1

[auditd_raw_comm]
REGEX = [\s']comm=("[^"\r\n]*"|[0-9A-F]+(?=[\s'\x1d]|$)|\(null\))
FORMAT = auditd_raw_comm::$1

[auditd_raw_cwd]
REGEX = [\s']cwd=("[^"\r\n]*"|[0-9A-F]+(?=[\s'\x1d]|$)|\(null\))
FORMAT = auditd_raw_cwd::$1

[auditd_raw_acct]
REGEX = [\s']acct=("[^"\r\n]*"|[0-9A-F]+(?=[\s'\x1d]|$)|\(null\))
FORMAT = auditd_raw_acct::$1

[auditd_raw_cmd]
REGEX = [\s']cmd=("[^"\r\n]*"|[0-9A-F]+(?=[\s'\x1d]|$)|\(null\))
FORMAT = auditd_raw_cmd::$1

# Arguments of the EXECVE record(s), encoding kept: a0="ls" a1=2F746D70...
# Long arguments continue in further EXECVE records (a1[1]=...).
[auditd_execve_args]
REGEX = \btype=EXECVE msg=audit\([^)]*\):\s*(?:argc=\d+\s+)?([^\r\n\x1d]+)
FORMAT = auditd_execve_args::$1
MV_ADD = true

# PROCTITLE: "quoted", or hex with NUL bytes between the arguments
[auditd_proctitle_raw]
REGEX = \btype=PROCTITLE msg=audit\([^)]*\):\s*proctitle=(\S+)
FORMAT = auditd_proctitle_raw::$1

#------------------------------------------------------------------------------
# The PATH item that describes the file, by nametype. The transforms run in
# the order listed in props.conf and the first match wins, so a CREATE item
# is preferred over DELETE (rename: the new name), DELETE over NORMAL, and the
# parent directory is used only when nothing else was recorded.
#------------------------------------------------------------------------------
# a file or directory created
[auditd_path_create]
REGEX = \btype=PATH msg=audit\([^)]*\):\s*item=\d+ name=("[^"\r\n]*"|\S+)(?:[^\r\n]*?\smode=(\d+) ouid=(\d+) ogid=(\d+))?[^\r\n]*?\snametype=(CREATE)\b(?:[^\r\n\x1d]*\x1dOUID="([^"]*)" OGID="([^"]*)")?
FORMAT = auditd_file_raw::$1 auditd_file_mode::$2 auditd_file_ouid::$3 auditd_file_ogid::$4 auditd_file_nametype::$5 auditd_file_owner::$6 auditd_file_group::$7

# a file removed or renamed away
[auditd_path_delete]
REGEX = \btype=PATH msg=audit\([^)]*\):\s*item=\d+ name=("[^"\r\n]*"|\S+)(?:[^\r\n]*?\smode=(\d+) ouid=(\d+) ogid=(\d+))?[^\r\n]*?\snametype=(DELETE)\b(?:[^\r\n\x1d]*\x1dOUID="([^"]*)" OGID="([^"]*)")?
FORMAT = auditd_file_raw::$1 auditd_file_mode::$2 auditd_file_ouid::$3 auditd_file_ogid::$4 auditd_file_nametype::$5 auditd_file_owner::$6 auditd_file_group::$7

# an existing file
[auditd_path_normal]
REGEX = \btype=PATH msg=audit\([^)]*\):\s*item=\d+ name=("[^"\r\n]*"|\S+)(?:[^\r\n]*?\smode=(\d+) ouid=(\d+) ogid=(\d+))?[^\r\n]*?\snametype=(NORMAL)\b(?:[^\r\n\x1d]*\x1dOUID="([^"]*)" OGID="([^"]*)")?
FORMAT = auditd_file_raw::$1 auditd_file_mode::$2 auditd_file_ouid::$3 auditd_file_ogid::$4 auditd_file_nametype::$5 auditd_file_owner::$6 auditd_file_group::$7

# a name that did not resolve (e.g. ENOENT)
[auditd_path_unknown]
REGEX = \btype=PATH msg=audit\([^)]*\):\s*item=\d+ name=("[^"\r\n]*"|\S+)(?:[^\r\n]*?\smode=(\d+) ouid=(\d+) ogid=(\d+))?[^\r\n]*?\snametype=(UNKNOWN)\b(?:[^\r\n\x1d]*\x1dOUID="([^"]*)" OGID="([^"]*)")?
FORMAT = auditd_file_raw::$1 auditd_file_mode::$2 auditd_file_ouid::$3 auditd_file_ogid::$4 auditd_file_nametype::$5 auditd_file_owner::$6 auditd_file_group::$7

# any other item except the parent directory
[auditd_path_other]
REGEX = \btype=PATH msg=audit\([^)]*\):\s*item=\d+ name=("[^"\r\n]*"|\S+)(?:[^\r\n]*?\smode=(\d+) ouid=(\d+) ogid=(\d+))?[^\r\n]*?\snametype=((?!PARENT\b)\w+)\b(?:[^\r\n\x1d]*\x1dOUID="([^"]*)" OGID="([^"]*)")?
FORMAT = auditd_file_raw::$1 auditd_file_mode::$2 auditd_file_ouid::$3 auditd_file_ogid::$4 auditd_file_nametype::$5 auditd_file_owner::$6 auditd_file_group::$7

# only the parent directory was recorded
[auditd_path_parent]
REGEX = \btype=PATH msg=audit\([^)]*\):\s*item=\d+ name=("[^"\r\n]*"|\S+)(?:[^\r\n]*?\smode=(\d+) ouid=(\d+) ogid=(\d+))?[^\r\n]*?\snametype=(PARENT)\b(?:[^\r\n\x1d]*\x1dOUID="([^"]*)" OGID="([^"]*)")?
FORMAT = auditd_file_raw::$1 auditd_file_mode::$2 auditd_file_ouid::$3 auditd_file_ogid::$4 auditd_file_nametype::$5 auditd_file_owner::$6 auditd_file_group::$7

#------------------------------------------------------------------------------
# Lookups
#------------------------------------------------------------------------------
# Event class -> CIM action, status, change_type, object_category, result and
# a readable signature. Keyed on the auditd_action and auditd_outcome helper
# fields computed in props.conf. Rows with auditd_outcome="*" match any
# outcome; specific rows come first and max_matches = 1 returns the first one.
[auditd_actions_lookup]
filename = auditd_actions.csv
match_type = WILDCARD(auditd_outcome)
max_matches = 1
case_sensitive_match = true

# Record type (USER_LOGIN) -> numeric record type and description.
[auditd_record_types_lookup]
filename = auditd_record_types.csv
max_matches = 1
case_sensitive_match = true
