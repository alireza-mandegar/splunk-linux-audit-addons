###############################################################################
# SOC-TA-auditd tags.conf
# Tags are the constraint tags of the CIM data models (Splunk_SA_CIM
# default/data/models/*.json). Eventtypes without a stanza here are
# intentionally untagged (sessions, duplicates, classes without a CIM model).
###############################################################################

#--- Endpoint.Processes: process report
[eventtype=auditd_process_start]
process = enabled
report = enabled

[eventtype=auditd_user_cmd]
process = enabled
report = enabled

#--- Endpoint.Ports: listening port
[eventtype=auditd_socket_bind]
listening = enabled
port = enabled

#--- Endpoint.Services: service report
[eventtype=auditd_service_start]
service = enabled
report = enabled

[eventtype=auditd_service_stop]
service = enabled
report = enabled

#--- Endpoint.Filesystem: endpoint filesystem
# Not tagged "change": Change.All_Changes excludes object_category=file.
[eventtype=auditd_file_access]
endpoint = enabled
filesystem = enabled

#--- Authentication (+ privileged)
[eventtype=auditd_user_login]
authentication = enabled

[eventtype=auditd_user_auth]
authentication = enabled

[eventtype=auditd_privileged_auth]
authentication = enabled
privileged = enabled

#--- Change.Account_Management: change account
[eventtype=auditd_user_change]
change = enabled
account = enabled

[eventtype=auditd_group_change]
change = enabled
account = enabled

#--- Change.Auditing_Changes: change audit
[eventtype=auditd_audit_change]
change = enabled
audit = enabled

#--- Change.Endpoint_Changes: change endpoint
[eventtype=auditd_software_change]
change = enabled
endpoint = enabled

[eventtype=auditd_system_boot]
change = enabled
endpoint = enabled

[eventtype=auditd_system_shutdown]
change = enabled
endpoint = enabled

#--- Network_Traffic: network communicate
[eventtype=auditd_socket_connection]
network = enabled
communicate = enabled
