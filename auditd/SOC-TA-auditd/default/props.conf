###############################################################################
# SOC-TA-auditd props.conf
#
# Sourcetype auditd: the Linux audit daemon log (/var/log/audit/audit.log).
# Full CIM mapping needs log_format = ENRICHED in auditd.conf (the default
# since audit 3.0): every record then carries the interpreted names after a
# 0x1D separator (SYSCALL=execve, UID="root", AUID="alice", SADDR={ ... }).
#
# One Splunk event = one audit event. The kernel writes an event as several
# records (SYSCALL, EXECVE, CWD, PATH, SOCKADDR, PROCTITLE, ...) that share
# the id msg=audit(<epoch>.<ms>:<serial>). LINE_BREAKER keeps consecutive
# records with the same id together and starts a new event where the id
# changes, so records of two interleaved events are split, never mixed.
#
# Search-time order inside this stanza:
#   REPORT -> FIELDALIAS -> EVAL -> LOOKUP -> eventtypes -> tags
# EVALs are computed in parallel: no EVAL reads another EVAL's output, which
# is why the decoding expressions are repeated. EVALs read REPORT outputs;
# LOOKUPs read EVAL outputs.
#
# Nothing here overwrites an existing field. Every EVAL is
# coalesce('<itself>', <mapping>) and every LOOKUP uses OUTPUTNEW, so CIM
# fields that already exist on an event (from another app) are kept.
###############################################################################

[auditd]
description = Linux audit daemon log (auditd log_format ENRICHED or RAW)
category = Operating System
pulldown_type = 1

#------------------------------------------------------------------------------
# Parsing (indexers / heavy forwarders; EVENT_BREAKER_* on universal forwarders)
#------------------------------------------------------------------------------
SHOULD_LINEMERGE = false
# Break after a record only when the next line is complete and carries a
# different msg=audit(...) id (or no id at all). The first capturing group
# (the newline) sits inside a lookahead so the id can be captured before it
# and compared after it. Nothing is broken while the next line has not
# arrived yet, so events are not cut at read-chunk boundaries.
LINE_BREAKER = msg=audit\((?=[\d.]+:\d+\)[^\r\n]*+([\r\n]+))([\d.]+:\d+)\)[^\r\n]*+(?>[\r\n]+)(?=[^\r\n]*?msg=audit\((?!\2\))[\d.]+:\d+\)|(?![^\r\n]*?msg=audit\()[^\r\n]+[\r\n])
# The regex has to see the previous record (up to ~9 KB) at chunk boundaries.
LINE_BREAKER_LOOKBEHIND = 10000
EVENT_BREAKER_ENABLE = true
EVENT_BREAKER = msg=audit\((?=[\d.]+:\d+\)[^\r\n]*+([\r\n]+))([\d.]+:\d+)\)[^\r\n]*+(?>[\r\n]+)(?=[^\r\n]*?msg=audit\((?!\2\))[\d.]+:\d+\)|(?![^\r\n]*?msg=audit\()[^\r\n]+[\r\n])
# Events with many PATH records or long EXECVE argument lists.
TRUNCATE = 100000
# msg=audit(1729757807.137:512): epoch seconds with milliseconds. Also works
# when a syslog header precedes the record.
TIME_PREFIX = msg=audit\(
TIME_FORMAT = %s.%3N
MAX_TIMESTAMP_LOOKAHEAD = 14
CHARSET = UTF-8

#------------------------------------------------------------------------------
# Field extraction
#------------------------------------------------------------------------------
KV_MODE = none
AUTO_KV_JSON = false
# Every key=value of every record, raw (lower case) and ENRICHED (upper case);
# keys that occur in several records become multivalue fields, in record
# order. The quoted user-space message msg='...' is split into its fields.
REPORT-auditd_kv = auditd_kv
# The record that names the event: a non-auxiliary record (CONFIG_CHANGE,
# USER_LOGIN, AVC, ...), else SYSCALL, else the first record.
REPORT-auditd_record_type = auditd_record_type_primary, auditd_record_type_syscall, auditd_record_type_first
# Per-record values that need the raw encoding (quoted or hex) or a record
# that has to win over others (the PATH item that describes the file).
REPORT-auditd_records = auditd_event_id, auditd_raw_exe, auditd_raw_comm, auditd_raw_cwd, auditd_raw_acct, auditd_raw_cmd, auditd_execve_args, auditd_proctitle_raw, auditd_path_create, auditd_path_delete, auditd_path_normal, auditd_path_unknown, auditd_path_other, auditd_path_parent

#------------------------------------------------------------------------------
# Lookup keys (inputs of LOOKUP-auditd_actions_*)
#------------------------------------------------------------------------------
# Event class: the record type, or the syscall name for kernel syscall events.
# open/openat/open_by_handle_at are split by access mode: created when a PATH
# record says CREATE, modified when the flags request write access, create,
# truncate or append (O_WRONLY 1, O_RDWR 2, O_CREAT 0x40, O_TRUNC 0x200,
# O_APPEND 0x400 on x86_64 and aarch64), else read. Flags are a1 for open and
# a2 for openat and open_by_handle_at; openat2 passes them in a struct.
EVAL-auditd_action = case(\
  auditd_record_type=="SOFTWARE_UPDATE", "SOFTWARE_UPDATE:" . coalesce(op, "unknown"),\
  auditd_record_type!="SYSCALL", auditd_record_type,\
  in(SYSCALL, "open", "openat", "open_by_handle_at", "openat2", "creat"), "open:" . case(\
    SYSCALL=="creat" OR auditd_file_nametype=="CREATE", "created",\
    SYSCALL=="openat2", "read",\
    tonumber(mvindex(if(SYSCALL=="open", a1, a2), 0), 16) % 4 > 0 OR floor(tonumber(mvindex(if(SYSCALL=="open", a1, a2), 0), 16) / 64) % 2 == 1 OR floor(tonumber(mvindex(if(SYSCALL=="open", a1, a2), 0), 16) / 512) % 4 > 0, "modified",\
    true(), "read"),\
  true(), coalesce(SYSCALL, "syscall_" . mvindex(syscall, 0)))

# A non-blocking connect() returns EINPROGRESS (-115) or EALREADY (-114)
# although the connection proceeds.
EVAL-auditd_outcome = case(\
  auditd_record_type=="SYSCALL" AND SYSCALL=="connect" AND in(mvindex(exit, 0), "-115", "-114"), "success",\
  in(mvindex(res, 0), "success", "1", "yes"), "success",\
  isnotnull(mvindex(res, 0)), "failure",\
  mvindex(success, 0)=="yes", "success",\
  mvindex(success, 0)=="no", "failure",\
  true(), "unknown")

#------------------------------------------------------------------------------
# Common fields
#------------------------------------------------------------------------------
EVAL-vendor = coalesce(vendor, "Linux")
EVAL-product = coalesce(product, "auditd")
EVAL-vendor_product = coalesce(vendor_product, "Linux auditd")
# node= is present when auditd.conf sets name_format; otherwise the Splunk host.
EVAL-dvc = coalesce(dvc, coalesce(mvindex(node, 0), host))
EVAL-session_id = coalesce(session_id, if(mvindex(ses, 0)!="4294967295", mvindex(ses, 0), null()))
# Syscall events: the syscall name. Other events: the numeric record type
# (USER_LOGIN = 1112), filled by LOOKUP-auditd_signature_id.
EVAL-signature_id = coalesce(signature_id, if(auditd_record_type=="SYSCALL", SYSCALL, null()))

#------------------------------------------------------------------------------
# dest / src
# Host-centric (the audited host), except for network syscalls where the
# SOCKADDR record holds the remote peer (connect: destination, accept: source).
#------------------------------------------------------------------------------
EVAL-dest = coalesce(dest, if(SYSCALL=="connect" AND in(saddr_fam, "inet", "inet6"), laddr, coalesce(mvindex(node, 0), host)))
EVAL-dest_ip = coalesce(dest_ip, if(in(SYSCALL, "connect", "bind") AND in(saddr_fam, "inet", "inet6"), laddr, null()))
EVAL-dest_port = coalesce(dest_port, if(in(SYSCALL, "connect", "bind") AND in(saddr_fam, "inet", "inet6"), tonumber(lport), null()))
EVAL-src = coalesce(src, case(\
  in(SYSCALL, "accept", "accept4") AND in(saddr_fam, "inet", "inet6"), laddr,\
  SYSCALL=="connect", coalesce(mvindex(node, 0), host),\
  SYSCALL=="bind", null(),\
  true(), coalesce(if(match(addr, "^[0-9A-Fa-f:.]+$"), addr, null()), if(hostname!="?", hostname, null()), coalesce(mvindex(node, 0), host))))
EVAL-src_ip = coalesce(src_ip, case(\
  in(SYSCALL, "accept", "accept4") AND in(saddr_fam, "inet", "inet6"), laddr,\
  match(addr, "^[0-9A-Fa-f:.]+$"), addr))
EVAL-src_port = coalesce(src_port, if(in(SYSCALL, "accept", "accept4") AND in(saddr_fam, "inet", "inet6"), tonumber(lport), null()))

#------------------------------------------------------------------------------
# Users (ENRICHED names; numeric ids with log_format = RAW)
#   UID / uid   real user of the process
#   AUID / auid login user ("unset" for daemons)
#   acct / ID   account that PAM or shadow-utils acted on
#------------------------------------------------------------------------------
EVAL-user = coalesce(user, case(\
  in(auditd_record_type, "ADD_USER", "DEL_USER", "USER_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK", "ROLE_ASSIGN", "ROLE_REMOVE") OR in(auditd_record_type, "ADD_GROUP", "DEL_GROUP", "GRP_MGMT", "GRP_CHAUTHTOK") OR in(auditd_record_type, "USER_AUTH", "USER_ACCT", "USER_LOGIN", "USER_LOGOUT", "USER_START", "USER_END", "USER_ERR", "CRED_ACQ", "CRED_DISP", "CRED_REFR"), coalesce(if(auditd_raw_acct=="(null)", null(), if(match(auditd_raw_acct, "^\""), replace(auditd_raw_acct, "^\"(.*)\"$", "\1"), if(match(auditd_raw_acct, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_acct, "([0-9A-F]{2})", "%\1")), auditd_raw_acct))), if(match(mvindex(ID, 0), "^unknown\("), null(), mvindex(ID, 0)), mvindex(id, 0)),\
  auditd_record_type=="ANOM_LOGIN_FAILURES", coalesce(mvindex(SUID, 0), mvindex(suid, 0)),\
  auditd_record_type=="LOGIN", coalesce(if(mvindex(AUID, 0)!="unset", mvindex(AUID, 0), null()), mvindex(auid, 0)),\
  in(auditd_record_type, "CONFIG_CHANGE", "DAEMON_START", "DAEMON_END", "DAEMON_ABORT", "SOFTWARE_UPDATE"), coalesce(if(mvindex(AUID, 0)!="unset", mvindex(AUID, 0), null()), mvindex(UID, 0), mvindex(uid, 0)),\
  true(), coalesce(mvindex(UID, 0), mvindex(uid, 0))))

EVAL-user_id = coalesce(user_id, case(\
  in(auditd_record_type, "ADD_USER", "DEL_USER", "USER_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK", "ROLE_ASSIGN", "ROLE_REMOVE") OR in(auditd_record_type, "ADD_GROUP", "DEL_GROUP", "GRP_MGMT", "GRP_CHAUTHTOK") OR in(auditd_record_type, "USER_AUTH", "USER_ACCT", "USER_LOGIN", "USER_LOGOUT", "USER_START", "USER_END", "USER_ERR", "CRED_ACQ", "CRED_DISP", "CRED_REFR"), mvindex(id, 0),\
  auditd_record_type=="ANOM_LOGIN_FAILURES", mvindex(suid, 0),\
  auditd_record_type=="LOGIN", mvindex(auid, 0),\
  in(auditd_record_type, "CONFIG_CHANGE", "DAEMON_START", "DAEMON_END", "DAEMON_ABORT", "SOFTWARE_UPDATE"), coalesce(if(mvindex(auid, 0)!="4294967295", mvindex(auid, 0), null()), mvindex(uid, 0)),\
  true(), mvindex(uid, 0)))

EVAL-user_name = coalesce(user_name, if(in(auditd_record_type, "ADD_USER", "DEL_USER", "USER_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK", "ROLE_ASSIGN", "ROLE_REMOVE") OR in(auditd_record_type, "ADD_GROUP", "DEL_GROUP", "GRP_MGMT", "GRP_CHAUTHTOK"), coalesce(if(auditd_raw_acct=="(null)", null(), if(match(auditd_raw_acct, "^\""), replace(auditd_raw_acct, "^\"(.*)\"$", "\1"), if(match(auditd_raw_acct, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_acct, "([0-9A-F]{2})", "%\1")), auditd_raw_acct))), if(match(mvindex(ID, 0), "^unknown\("), null(), mvindex(ID, 0)), mvindex(id, 0)), null()))

# src_user: who made an account change, or who started a privilege change
# (sudo, su, ...). Not set for plain logons.
EVAL-src_user = coalesce(src_user, case(\
  in(auditd_record_type, "ADD_USER", "DEL_USER", "USER_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK", "ROLE_ASSIGN", "ROLE_REMOVE") OR in(auditd_record_type, "ADD_GROUP", "DEL_GROUP", "GRP_MGMT", "GRP_CHAUTHTOK"), coalesce(if(mvindex(AUID, 0)!="unset", mvindex(AUID, 0), null()), mvindex(UID, 0), mvindex(auid, 0)),\
  auditd_record_type=="ANOM_LOGIN_FAILURES", if(mvindex(AUID, 0)!="unset", mvindex(AUID, 0), null()),\
  in(auditd_record_type, "USER_AUTH", "USER_ACCT", "USER_LOGIN", "USER_START", "USER_END", "CRED_ACQ", "CRED_REFR") AND (match(if(auditd_raw_exe=="(null)", null(), if(match(auditd_raw_exe, "^\""), replace(auditd_raw_exe, "^\"(.*)\"$", "\1"), if(match(auditd_raw_exe, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_exe, "([0-9A-F]{2})", "%\1")), auditd_raw_exe))), "/(sudo|sudoedit|su|runuser|pkexec|doas)$") OR (isnotnull(if(mvindex(AUID, 0)!="unset", mvindex(AUID, 0), null())) AND if(mvindex(AUID, 0)!="unset", mvindex(AUID, 0), null())!=coalesce(if(auditd_raw_acct=="(null)", null(), if(match(auditd_raw_acct, "^\""), replace(auditd_raw_acct, "^\"(.*)\"$", "\1"), if(match(auditd_raw_acct, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_acct, "([0-9A-F]{2})", "%\1")), auditd_raw_acct))), if(match(mvindex(ID, 0), "^unknown\("), null(), mvindex(ID, 0)), "-"))), coalesce(if(mvindex(AUID, 0)!="unset", mvindex(AUID, 0), null()), mvindex(UID, 0))))

EVAL-src_user_name = coalesce(src_user_name, if(in(auditd_record_type, "ADD_USER", "DEL_USER", "USER_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK", "ROLE_ASSIGN", "ROLE_REMOVE") OR in(auditd_record_type, "ADD_GROUP", "DEL_GROUP", "GRP_MGMT", "GRP_CHAUTHTOK"), coalesce(if(mvindex(AUID, 0)!="unset", mvindex(AUID, 0), null()), mvindex(UID, 0), mvindex(auid, 0)), null()))

#------------------------------------------------------------------------------
# Authentication
#------------------------------------------------------------------------------
EVAL-app = coalesce(app, replace(if(auditd_raw_exe=="(null)", null(), if(match(auditd_raw_exe, "^\""), replace(auditd_raw_exe, "^\"(.*)\"$", "\1"), if(match(auditd_raw_exe, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_exe, "([0-9A-F]{2})", "%\1")), auditd_raw_exe))), "^.*/", ""))
EVAL-authentication_method = coalesce(authentication_method, if(match(op, "^PAM:"), "PAM", null()))

#------------------------------------------------------------------------------
# Processes
# "process" is the command line: EXECVE arguments (complete), else PROCTITLE
# (the kernel keeps 128 bytes), else the sudo command, else the executable.
# For Authentication events this is the executable of the logon service.
# USER_CMD (sudo) describes the command sudo started: sudo is its parent.
#------------------------------------------------------------------------------
EVAL-process = coalesce(process, if(isnull(auditd_execve_args), null(), trim(urldecode(replace(replace(replace(replace(replace(replace(replace(replace(mvjoin(auditd_execve_args, " "), "\s*\ba\d+_len=\d+", ""), "\"?\s+a\d+\[[1-9]\d*\]=\"?", ""), "\[0\]=", "="), "%", "%25"), "\+", "%2B"), "([0-9A-F]{2})(?=(?:[0-9A-F]{2})*(?:\s|$))", "%\1"), "(?:^|\s+)a\d+=", " "), "\"", "")))), if(match(auditd_proctitle_raw, "^\""), replace(auditd_proctitle_raw, "^\"(.*)\"$", "\1"), trim(urldecode(replace(replace(auditd_proctitle_raw, "([0-9A-F]{2})", "%\1"), "%00", "%20")))), if(auditd_raw_cmd=="(null)", null(), if(match(auditd_raw_cmd, "^\""), replace(auditd_raw_cmd, "^\"(.*)\"$", "\1"), if(match(auditd_raw_cmd, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_cmd, "([0-9A-F]{2})", "%\1")), auditd_raw_cmd))), if(auditd_raw_exe=="(null)", null(), if(match(auditd_raw_exe, "^\""), replace(auditd_raw_exe, "^\"(.*)\"$", "\1"), if(match(auditd_raw_exe, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_exe, "([0-9A-F]{2})", "%\1")), auditd_raw_exe))))
EVAL-process_name = coalesce(process_name, if(auditd_record_type=="USER_CMD", replace(if(auditd_raw_cmd=="(null)", null(), if(match(auditd_raw_cmd, "^\""), replace(auditd_raw_cmd, "^\"(.*)\"$", "\1"), if(match(auditd_raw_cmd, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_cmd, "([0-9A-F]{2})", "%\1")), auditd_raw_cmd))), "^\s*(?:\S*/)?(\S+).*$", "\1"), coalesce(replace(if(auditd_raw_exe=="(null)", null(), if(match(auditd_raw_exe, "^\""), replace(auditd_raw_exe, "^\"(.*)\"$", "\1"), if(match(auditd_raw_exe, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_exe, "([0-9A-F]{2})", "%\1")), auditd_raw_exe))), "^.*/", ""), if(auditd_raw_comm=="(null)", null(), if(match(auditd_raw_comm, "^\""), replace(auditd_raw_comm, "^\"(.*)\"$", "\1"), if(match(auditd_raw_comm, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_comm, "([0-9A-F]{2})", "%\1")), auditd_raw_comm))))))
EVAL-process_exec = coalesce(process_exec, if(auditd_record_type=="USER_CMD", replace(if(auditd_raw_cmd=="(null)", null(), if(match(auditd_raw_cmd, "^\""), replace(auditd_raw_cmd, "^\"(.*)\"$", "\1"), if(match(auditd_raw_cmd, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_cmd, "([0-9A-F]{2})", "%\1")), auditd_raw_cmd))), "^\s*(?:\S*/)?(\S+).*$", "\1"), coalesce(replace(if(auditd_raw_exe=="(null)", null(), if(match(auditd_raw_exe, "^\""), replace(auditd_raw_exe, "^\"(.*)\"$", "\1"), if(match(auditd_raw_exe, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_exe, "([0-9A-F]{2})", "%\1")), auditd_raw_exe))), "^.*/", ""), if(auditd_raw_comm=="(null)", null(), if(match(auditd_raw_comm, "^\""), replace(auditd_raw_comm, "^\"(.*)\"$", "\1"), if(match(auditd_raw_comm, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_comm, "([0-9A-F]{2})", "%\1")), auditd_raw_comm))))))
EVAL-process_path = coalesce(process_path, if(auditd_record_type=="USER_CMD", if(match(if(auditd_raw_cmd=="(null)", null(), if(match(auditd_raw_cmd, "^\""), replace(auditd_raw_cmd, "^\"(.*)\"$", "\1"), if(match(auditd_raw_cmd, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_cmd, "([0-9A-F]{2})", "%\1")), auditd_raw_cmd))), "^\s*/"), replace(if(auditd_raw_cmd=="(null)", null(), if(match(auditd_raw_cmd, "^\""), replace(auditd_raw_cmd, "^\"(.*)\"$", "\1"), if(match(auditd_raw_cmd, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_cmd, "([0-9A-F]{2})", "%\1")), auditd_raw_cmd))), "^\s*(\S+).*$", "\1"), null()), if(auditd_raw_exe=="(null)", null(), if(match(auditd_raw_exe, "^\""), replace(auditd_raw_exe, "^\"(.*)\"$", "\1"), if(match(auditd_raw_exe, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_exe, "([0-9A-F]{2})", "%\1")), auditd_raw_exe)))))
EVAL-process_id = coalesce(process_id, if(auditd_record_type=="USER_CMD", null(), mvindex(pid, 0)))
EVAL-process_current_directory = coalesce(process_current_directory, if(auditd_raw_cwd=="(null)", null(), if(match(auditd_raw_cwd, "^\""), replace(auditd_raw_cwd, "^\"(.*)\"$", "\1"), if(match(auditd_raw_cwd, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_cwd, "([0-9A-F]{2})", "%\1")), auditd_raw_cwd))))
EVAL-parent_process_id = coalesce(parent_process_id, if(auditd_record_type=="USER_CMD", mvindex(pid, 0), mvindex(ppid, 0)))
EVAL-parent_process_name = coalesce(parent_process_name, if(auditd_record_type=="USER_CMD", replace(if(auditd_raw_exe=="(null)", null(), if(match(auditd_raw_exe, "^\""), replace(auditd_raw_exe, "^\"(.*)\"$", "\1"), if(match(auditd_raw_exe, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_exe, "([0-9A-F]{2})", "%\1")), auditd_raw_exe))), "^.*/", ""), null()))
EVAL-parent_process_exec = coalesce(parent_process_exec, if(auditd_record_type=="USER_CMD", replace(if(auditd_raw_exe=="(null)", null(), if(match(auditd_raw_exe, "^\""), replace(auditd_raw_exe, "^\"(.*)\"$", "\1"), if(match(auditd_raw_exe, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_exe, "([0-9A-F]{2})", "%\1")), auditd_raw_exe))), "^.*/", ""), null()))
EVAL-parent_process_path = coalesce(parent_process_path, if(auditd_record_type=="USER_CMD", if(auditd_raw_exe=="(null)", null(), if(match(auditd_raw_exe, "^\""), replace(auditd_raw_exe, "^\"(.*)\"$", "\1"), if(match(auditd_raw_exe, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_exe, "([0-9A-F]{2})", "%\1")), auditd_raw_exe))), null()))
EVAL-parent_user = coalesce(parent_user, if(auditd_record_type=="USER_CMD", mvindex(UID, 0), null()))

# Linux has no integrity levels. Heuristic: root without a login session
# (auid unset) = system, other root = high, any other user = medium.
EVAL-process_integrity_level = coalesce(process_integrity_level, if(auditd_record_type=="SYSCALL" AND in(SYSCALL, "execve", "execveat"), case(\
  mvindex(euid, 0)=="0" AND mvindex(auid, 0)=="4294967295", "system",\
  mvindex(euid, 0)=="0", "high",\
  isnotnull(mvindex(euid, 0)), "medium"), null()))

#------------------------------------------------------------------------------
# Filesystem
# The file is the PATH item chosen by REPORT-auditd_records (CREATE, DELETE,
# NORMAL, UNKNOWN, other, PARENT, first match wins). Relative names are
# joined with the CWD record.
#------------------------------------------------------------------------------
EVAL-file_path = coalesce(file_path, if(isnull(if(auditd_file_raw=="(null)", null(), if(match(auditd_file_raw, "^\""), replace(auditd_file_raw, "^\"(.*)\"$", "\1"), if(match(auditd_file_raw, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_file_raw, "([0-9A-F]{2})", "%\1")), auditd_file_raw)))), null(), replace(if(match(if(auditd_file_raw=="(null)", null(), if(match(auditd_file_raw, "^\""), replace(auditd_file_raw, "^\"(.*)\"$", "\1"), if(match(auditd_file_raw, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_file_raw, "([0-9A-F]{2})", "%\1")), auditd_file_raw))), "^/") OR isnull(if(auditd_raw_cwd=="(null)", null(), if(match(auditd_raw_cwd, "^\""), replace(auditd_raw_cwd, "^\"(.*)\"$", "\1"), if(match(auditd_raw_cwd, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_cwd, "([0-9A-F]{2})", "%\1")), auditd_raw_cwd)))), if(auditd_file_raw=="(null)", null(), if(match(auditd_file_raw, "^\""), replace(auditd_file_raw, "^\"(.*)\"$", "\1"), if(match(auditd_file_raw, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_file_raw, "([0-9A-F]{2})", "%\1")), auditd_file_raw))), if(auditd_raw_cwd=="(null)", null(), if(match(auditd_raw_cwd, "^\""), replace(auditd_raw_cwd, "^\"(.*)\"$", "\1"), if(match(auditd_raw_cwd, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_cwd, "([0-9A-F]{2})", "%\1")), auditd_raw_cwd))) . "/" . if(auditd_file_raw=="(null)", null(), if(match(auditd_file_raw, "^\""), replace(auditd_file_raw, "^\"(.*)\"$", "\1"), if(match(auditd_file_raw, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_file_raw, "([0-9A-F]{2})", "%\1")), auditd_file_raw)))), "(.)/+$", "\1")))
EVAL-file_name = coalesce(file_name, if(isnotnull(if(isnull(if(auditd_file_raw=="(null)", null(), if(match(auditd_file_raw, "^\""), replace(auditd_file_raw, "^\"(.*)\"$", "\1"), if(match(auditd_file_raw, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_file_raw, "([0-9A-F]{2})", "%\1")), auditd_file_raw)))), null(), replace(if(match(if(auditd_file_raw=="(null)", null(), if(match(auditd_file_raw, "^\""), replace(auditd_file_raw, "^\"(.*)\"$", "\1"), if(match(auditd_file_raw, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_file_raw, "([0-9A-F]{2})", "%\1")), auditd_file_raw))), "^/") OR isnull(if(auditd_raw_cwd=="(null)", null(), if(match(auditd_raw_cwd, "^\""), replace(auditd_raw_cwd, "^\"(.*)\"$", "\1"), if(match(auditd_raw_cwd, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_cwd, "([0-9A-F]{2})", "%\1")), auditd_raw_cwd)))), if(auditd_file_raw=="(null)", null(), if(match(auditd_file_raw, "^\""), replace(auditd_file_raw, "^\"(.*)\"$", "\1"), if(match(auditd_file_raw, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_file_raw, "([0-9A-F]{2})", "%\1")), auditd_file_raw))), if(auditd_raw_cwd=="(null)", null(), if(match(auditd_raw_cwd, "^\""), replace(auditd_raw_cwd, "^\"(.*)\"$", "\1"), if(match(auditd_raw_cwd, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_cwd, "([0-9A-F]{2})", "%\1")), auditd_raw_cwd))) . "/" . if(auditd_file_raw=="(null)", null(), if(match(auditd_file_raw, "^\""), replace(auditd_file_raw, "^\"(.*)\"$", "\1"), if(match(auditd_file_raw, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_file_raw, "([0-9A-F]{2})", "%\1")), auditd_file_raw)))), "(.)/+$", "\1"))), replace(if(isnull(if(auditd_file_raw=="(null)", null(), if(match(auditd_file_raw, "^\""), replace(auditd_file_raw, "^\"(.*)\"$", "\1"), if(match(auditd_file_raw, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_file_raw, "([0-9A-F]{2})", "%\1")), auditd_file_raw)))), null(), replace(if(match(if(auditd_file_raw=="(null)", null(), if(match(auditd_file_raw, "^\""), replace(auditd_file_raw, "^\"(.*)\"$", "\1"), if(match(auditd_file_raw, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_file_raw, "([0-9A-F]{2})", "%\1")), auditd_file_raw))), "^/") OR isnull(if(auditd_raw_cwd=="(null)", null(), if(match(auditd_raw_cwd, "^\""), replace(auditd_raw_cwd, "^\"(.*)\"$", "\1"), if(match(auditd_raw_cwd, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_cwd, "([0-9A-F]{2})", "%\1")), auditd_raw_cwd)))), if(auditd_file_raw=="(null)", null(), if(match(auditd_file_raw, "^\""), replace(auditd_file_raw, "^\"(.*)\"$", "\1"), if(match(auditd_file_raw, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_file_raw, "([0-9A-F]{2})", "%\1")), auditd_file_raw))), if(auditd_raw_cwd=="(null)", null(), if(match(auditd_raw_cwd, "^\""), replace(auditd_raw_cwd, "^\"(.*)\"$", "\1"), if(match(auditd_raw_cwd, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_cwd, "([0-9A-F]{2})", "%\1")), auditd_raw_cwd))) . "/" . if(auditd_file_raw=="(null)", null(), if(match(auditd_file_raw, "^\""), replace(auditd_file_raw, "^\"(.*)\"$", "\1"), if(match(auditd_file_raw, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_file_raw, "([0-9A-F]{2})", "%\1")), auditd_file_raw)))), "(.)/+$", "\1")), "^.*/", ""), null()))
EVAL-file_acl = coalesce(file_acl, if(isnotnull(auditd_file_mode), "mode=" . substr(auditd_file_mode, len(auditd_file_mode) - 3) . " owner=" . coalesce(auditd_file_owner, auditd_file_ouid) . " group=" . coalesce(auditd_file_group, auditd_file_ogid), null()))
EVAL-image = coalesce(image, if(auditd_record_type=="SYSCALL" AND isnotnull(auditd_file_raw), if(auditd_raw_exe=="(null)", null(), if(match(auditd_raw_exe, "^\""), replace(auditd_raw_exe, "^\"(.*)\"$", "\1"), if(match(auditd_raw_exe, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_exe, "([0-9A-F]{2})", "%\1")), auditd_raw_exe))), null()))

#------------------------------------------------------------------------------
# Ports (bind) and Network_Traffic (connect, accept)
# The records do not reveal the transport, except that accept() implies a
# connection-oriented (TCP) socket. bind does not prove listen().
#------------------------------------------------------------------------------
EVAL-state = coalesce(state, if(SYSCALL=="bind" AND in(saddr_fam, "inet", "inet6"), "listening", null()))
EVAL-creation_time = coalesce(creation_time, if(SYSCALL=="bind" AND in(saddr_fam, "inet", "inet6"), _time, null()))
EVAL-transport = coalesce(transport, if(in(SYSCALL, "accept", "accept4") AND in(saddr_fam, "inet", "inet6"), "tcp", null()))
EVAL-protocol = coalesce(protocol, if(in(SYSCALL, "connect", "accept", "accept4", "bind") AND in(saddr_fam, "inet", "inet6"), "ip", null()))
EVAL-protocol_version = coalesce(protocol_version, case(saddr_fam=="inet", "ipv4", saddr_fam=="inet6", "ipv6"))
EVAL-direction = coalesce(direction, case(SYSCALL=="connect" AND in(saddr_fam, "inet", "inet6"), "outbound", in(SYSCALL, "accept", "accept4") AND in(saddr_fam, "inet", "inet6"), "inbound"))

#------------------------------------------------------------------------------
# Services (systemd SERVICE_START / SERVICE_STOP)
#------------------------------------------------------------------------------
FIELDALIAS-auditd_service = unit ASNEW service unit ASNEW service_name unit ASNEW service_id

#------------------------------------------------------------------------------
# Change (Account_Management, Auditing_Changes, Endpoint_Changes)
#------------------------------------------------------------------------------
EVAL-object = coalesce(object, case(\
  in(auditd_record_type, "ADD_GROUP", "DEL_GROUP", "GRP_MGMT", "GRP_CHAUTHTOK"), coalesce(grp, if(auditd_raw_acct=="(null)", null(), if(match(auditd_raw_acct, "^\""), replace(auditd_raw_acct, "^\"(.*)\"$", "\1"), if(match(auditd_raw_acct, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_acct, "([0-9A-F]{2})", "%\1")), auditd_raw_acct))), if(match(mvindex(ID, 0), "^unknown\("), null(), mvindex(ID, 0)), mvindex(id, 0)),\
  in(auditd_record_type, "ADD_USER", "DEL_USER", "USER_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK", "ROLE_ASSIGN", "ROLE_REMOVE"), coalesce(if(auditd_raw_acct=="(null)", null(), if(match(auditd_raw_acct, "^\""), replace(auditd_raw_acct, "^\"(.*)\"$", "\1"), if(match(auditd_raw_acct, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_acct, "([0-9A-F]{2})", "%\1")), auditd_raw_acct))), if(match(mvindex(ID, 0), "^unknown\("), null(), mvindex(ID, 0)), mvindex(id, 0)),\
  auditd_record_type=="ANOM_LOGIN_FAILURES", coalesce(mvindex(SUID, 0), mvindex(suid, 0)),\
  auditd_record_type=="CONFIG_CHANGE", coalesce(if(mvindex(key, 0)!="(null)", mvindex(key, 0), null()), if(isnotnull(audit_enabled), "audit_enabled", null()), if(isnotnull(audit_failure), "audit_failure", null()), if(isnotnull(backlog_limit), "backlog_limit", null()), op),\
  in(auditd_record_type, "DAEMON_START", "DAEMON_END", "DAEMON_ABORT"), "auditd",\
  auditd_record_type=="SOFTWARE_UPDATE", sw,\
  in(auditd_record_type, "SYSTEM_BOOT", "SYSTEM_SHUTDOWN"), coalesce(mvindex(node, 0), host)))

EVAL-object_id = coalesce(object_id, if(in(auditd_record_type, "ADD_USER", "DEL_USER", "USER_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK", "ROLE_ASSIGN", "ROLE_REMOVE") OR in(auditd_record_type, "ADD_GROUP", "DEL_GROUP", "GRP_MGMT", "GRP_CHAUTHTOK"), mvindex(id, 0), if(auditd_record_type=="ANOM_LOGIN_FAILURES", mvindex(suid, 0), null())))

EVAL-object_attrs = coalesce(object_attrs, case(\
  in(auditd_record_type, "ADD_USER", "DEL_USER", "USER_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK", "ROLE_ASSIGN", "ROLE_REMOVE") OR in(auditd_record_type, "ADD_GROUP", "DEL_GROUP", "GRP_MGMT", "GRP_CHAUTHTOK") OR auditd_record_type=="ANOM_LOGIN_FAILURES", mvappend("op=" . op, "grp=" . grp),\
  auditd_record_type=="CONFIG_CHANGE", mvappend("op=" . op, "list=" . list, "audit_enabled=" . audit_enabled, "audit_failure=" . audit_failure, "backlog_limit=" . backlog_limit, "old=" . old),\
  in(auditd_record_type, "DAEMON_START", "DAEMON_END", "DAEMON_ABORT"), mvappend("op=" . op, "ver=" . ver, "format=" . format, "kernel=" . kernel),\
  auditd_record_type=="SOFTWARE_UPDATE", mvappend("op=" . op, "sw_type=" . sw_type, "gpg_res=" . gpg_res, "root_dir=" . root_dir)))

# The command line of auditctl/augenrules when the kernel logged it, else the
# executable that made the change (useradd, passwd, dnf, ...).
EVAL-command = coalesce(command, if(in(auditd_record_type, "ADD_USER", "DEL_USER", "USER_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK", "ROLE_ASSIGN", "ROLE_REMOVE") OR in(auditd_record_type, "ADD_GROUP", "DEL_GROUP", "GRP_MGMT", "GRP_CHAUTHTOK") OR in(auditd_record_type, "CONFIG_CHANGE", "SOFTWARE_UPDATE", "ANOM_LOGIN_FAILURES"), coalesce(if(match(auditd_proctitle_raw, "^\""), replace(auditd_proctitle_raw, "^\"(.*)\"$", "\1"), trim(urldecode(replace(replace(auditd_proctitle_raw, "([0-9A-F]{2})", "%\1"), "%00", "%20")))), if(auditd_raw_exe=="(null)", null(), if(match(auditd_raw_exe, "^\""), replace(auditd_raw_exe, "^\"(.*)\"$", "\1"), if(match(auditd_raw_exe, "^(?:[0-9A-F]{2})+$"), urldecode(replace(auditd_raw_exe, "([0-9A-F]{2})", "%\1")), auditd_raw_exe)))), null()))

#------------------------------------------------------------------------------
# Lookups (run after every EVAL above)
#------------------------------------------------------------------------------
LOOKUP-auditd_actions_action = auditd_actions_lookup auditd_action auditd_outcome OUTPUTNEW action
LOOKUP-auditd_actions_change_type = auditd_actions_lookup auditd_action auditd_outcome OUTPUTNEW change_type
LOOKUP-auditd_actions_object_category = auditd_actions_lookup auditd_action auditd_outcome OUTPUTNEW object_category
LOOKUP-auditd_actions_result = auditd_actions_lookup auditd_action auditd_outcome OUTPUTNEW result
LOOKUP-auditd_actions_signature = auditd_actions_lookup auditd_action auditd_outcome OUTPUTNEW signature
LOOKUP-auditd_actions_status = auditd_actions_lookup auditd_action auditd_outcome OUTPUTNEW status
LOOKUP-auditd_record_type = auditd_record_types_lookup auditd_record_type OUTPUTNEW auditd_record_type_id auditd_record_type_description
# Fallbacks for event classes that auditd_actions.csv does not map.
LOOKUP-auditd_signature = auditd_record_types_lookup auditd_record_type OUTPUTNEW auditd_record_type_description AS signature
LOOKUP-auditd_signature_id = auditd_record_types_lookup auditd_record_type OUTPUTNEW auditd_record_type_id AS signature_id
